context:
  name: scippneutron
  version: "26.10.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/scippneutron-${{ version }}.tar.gz
  sha256: 3c67a9e9603e5d356fb3a9e57113154478b797f4f0d6386bdd383fcbb1dc1707

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.9.0
    - email-validator >=2
    - h5py >=3.12
    - lazy_loader >=0.4
    - mpltoolbox >=24.6.0
    - numpy >=2
    - plopp >=26.5.0
    - pydantic >=2.4
    - pyyaml >=6.0.1
    - scipp >=25.11.0
    - scippnexus >=24.6.0
    - scipy >=1.13.0

tests:
  - python:
      imports:
        - scippneutron
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Neutron scattering tools for Data Reduction
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/scipp/scippneutron
  homepage: https://scipp.github.io/scippneutron/

extra:
  recipe-maintainers:
    - MridulS
    - conda-forge/scipp
